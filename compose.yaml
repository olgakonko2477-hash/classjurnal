services:
  journal:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      PUBLIC_ORIGIN: https://${JOURNAL_DOMAIN:?Set JOURNAL_DOMAIN in .env}
      COOKIE_SECURE: "true"
      JOURNAL_PASSWORD: ${JOURNAL_PASSWORD:?Set initial JOURNAL_PASSWORD in .env}
    volumes:
      - journal_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      JOURNAL_DOMAIN: ${JOURNAL_DOMAIN:?Set JOURNAL_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - journal
volumes:
  journal_data:
  caddy_data:
  caddy_config:
